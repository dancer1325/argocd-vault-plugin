apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
spec:
  template:
    spec:
      containers:
      - name: argocd-repo-server
        volumeMounts:
        - name: custom-tools
          mountPath: /usr/local/bin/argocd-vault-plugin
          subPath: argocd-vault-plugin

        # -- as -- Kubernetes Secret
        envFrom:
          - secretRef:
              name: argocd-vault-plugin-credentials
      volumes:
      - name: custom-tools
        emptyDir: {}
      initContainers:
      - name: download-tools
        image: alpine:3.8
        command: [sh, -c]

        # if you want ANOTHER stable release version -> update this value
        env:
          - name: AVP_VERSION
            value: "1.18.0"
        args:
          # 1. | amd64 nodes
#          - >-
#            wget -O argocd-vault-plugin
#            https://github.com/argoproj-labs/argocd-vault-plugin/releases/download/v${AVP_VERSION}/argocd-vault-plugin_${AVP_VERSION}_linux_amd64 &&
#            chmod +x argocd-vault-plugin &&
#            mv argocd-vault-plugin /custom-tools/
          # 2. | arm64 nodes
          - >-
            wget -O argocd-vault-plugin
            https://github.com/argoproj-labs/argocd-vault-plugin/releases/download/v${AVP_VERSION}/argocd-vault-plugin_${AVP_VERSION}_linux_armm64 &&
            chmod +x argocd-vault-plugin &&
            mv argocd-vault-plugin /custom-tools/
        volumeMounts:
          - mountPath: /custom-tools
            name: custom-tools

      # NOT strictly necessary
      # use cases / it's REQUIRED
      #   passing AVP configuration -- from a -- secret
      #   using Kubernetes auth -- to -- Hashicorp Vault
      automountServiceAccountToken: true
